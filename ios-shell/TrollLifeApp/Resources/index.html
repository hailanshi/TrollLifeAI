<style>
/* ===== 基础：暗色文字模拟器风格 ===== */
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:#0d0f12;color:#d8dee9;
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",Helvetica,Arial,sans-serif;
  font-size:15px;line-height:1.6;touch-action:manipulation;-webkit-text-size-adjust:100%;
  overflow:hidden;height:100%}
input,select,textarea,button{font-family:inherit;font-size:16px}
.safe-top{padding-top:env(safe-area-inset-top);padding-top:constant(safe-area-inset-top)}
.safe-bottom{padding-bottom:env(safe-area-inset-bottom);padding-bottom:constant(safe-area-inset-bottom)}

/* ===== 顶部标题栏 ===== */
#topbar{position:fixed;top:0;left:0;right:0;z-index:20;background:#12151b;
  border-bottom:1px solid #232833;box-sizing:border-box}
#topbarInner{display:flex;align-items:center;justify-content:space-between;padding:8px 12px;min-height:44px}
#appTitle{font-size:16px;font-weight:600;letter-spacing:.5px;color:#e6edf3}
#appTitle small{display:block;font-size:11px;color:#6b7684;font-weight:400;letter-spacing:0}
#topRight{display:flex;gap:6px;align-items:center}
.chip{font-size:11px;color:#9fb0c0;background:#1a1f28;border:1px solid #262d38;
  border-radius:999px;padding:3px 9px;white-space:nowrap}

/* ===== 内容区 ===== */
/* 顶部/底部内边距必须把「顶栏实际高度（含刘海安全区）」和「底部导航高度」算进去，
   否则内容会钻到顶栏下面被盖住。CSS 先给一个含 env() 的保守值，
   页面加载后再由 JS 用实测高度精确覆盖（见 syncLayout）。*/
#screen{position:fixed;top:0;left:0;right:0;bottom:0;overflow-y:auto;-webkit-overflow-scrolling:touch;
  padding:calc(60px + env(safe-area-inset-top)) 12px calc(84px + env(safe-area-inset-bottom)) 12px;
  box-sizing:border-box}
#screen.noNav{padding-bottom:calc(16px + env(safe-area-inset-bottom))}
.section{margin:0 0 12px 0}
.card{background:#14171d;border:1px solid #232833;border-radius:12px;padding:12px;margin-bottom:10px}
.card h3{margin:0 0 8px 0;font-size:14px;color:#9fb0c0;font-weight:600;letter-spacing:.5px}
.card h3 .tail{float:right;font-size:11px;color:#5e6874;font-weight:400}
.muted{color:#7b8794;font-size:12px}
.tiny{font-size:11px;color:#5e6874}
.center{text-align:center}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.sep{height:1px;background:#20252e;margin:8px 0}

/* ===== 属性 ===== */
.attrRow{display:flex;align-items:center;justify-content:space-between;padding:5px 0;border-bottom:1px dashed #1e232b}
.attrRow:last-child{border-bottom:0}
.attrName{color:#9fb0c0;font-size:13px}
.attrVal{font-variant-numeric:tabular-nums;font-weight:600;font-size:14px}
.bar{height:5px;background:#1c2129;border-radius:3px;overflow:hidden;margin-top:4px}
.bar > i{display:block;height:100%;background:#4a9d7f;border-radius:3px}
.up{color:#5fd39a}
.down{color:#e8796b}
.zero{color:#5e6874}

/* ===== 按钮 ===== */
.btn{display:block;width:100%;min-height:46px;padding:10px 12px;margin:6px 0;
  background:#1b212b;color:#d8dee9;border:1px solid #2b3340;border-radius:10px;
  font-size:15px;text-align:center;cursor:pointer;-webkit-appearance:none;appearance:none}
.btn:active{background:#232c38}
.btn.primary{background:#1f6f52;border-color:#2b8c68;color:#eafff5;font-weight:600}
.btn.primary:active{background:#25845f}
.btn.warn{background:#5c2b2b;border-color:#7d3a3a;color:#ffe9e9}
.btn.ghost{background:transparent;border-color:#2b3340;color:#9fb0c0}
.btn.sm{min-height:38px;font-size:13px;padding:7px 10px;margin:4px 0}
.btn[disabled]{opacity:.4}
.btnRow{display:flex;gap:8px}
.btnRow .btn{flex:1;margin:4px 0}

/* ===== 底部导航 ===== */
#nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:#12151b;border-top:1px solid #232833;display:flex}
#nav.hide{display:none}
#nav .tab{flex:1;padding:8px 1px 6px 1px;text-align:center;color:#6b7684;font-size:10px;cursor:pointer}
#nav .tab b{display:block;font-size:17px;line-height:1.2;font-weight:400}
#nav .tab.on{color:#7fd1ae}

/* ===== 主动行动卡片 ===== */
.actGrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.actCard{background:#1a1f28;border:1px solid #2b3340;border-radius:10px;padding:9px;cursor:pointer}
.actCard:active{background:#222a35}
.actCard.locked{opacity:.42;cursor:default}
.actCard .an{font-size:13px;color:#e6edf3;font-weight:600;display:flex;justify-content:space-between;align-items:center;gap:4px}
.actCard .atag{font-size:9px;color:#7fd1ae;border:1px solid #27503f;border-radius:4px;padding:0 4px;font-weight:400;white-space:nowrap}
.actCard .ad{font-size:10px;color:#7b8794;margin-top:4px;line-height:1.45}

/* ===== 关系互动按钮 ===== */
.relBtns{display:flex;gap:6px;flex-wrap:wrap;margin:2px 0 8px 0}
.btn.tiny2{min-height:30px;font-size:11px;padding:4px 9px;margin:0;width:auto;display:inline-block;border-radius:8px}

/* ===== AI 标记 ===== */
.tagAi{display:inline-block;font-size:10px;color:#9fd0ff;border:1px solid #274a6b;background:#132030;border-radius:4px;padding:1px 5px;margin-right:5px}
.aiField{margin:10px 0}
.aiField .lab{font-size:12px;color:#9fb0c0;margin-bottom:4px}
.aiField .hint{font-size:10px;color:#5e6874;margin-top:4px;line-height:1.5}
textarea.inp{width:100%;min-height:130px;padding:10px;border-radius:10px;background:#101319;border:1px solid #2b3340;color:#e6edf3;font-size:13px;line-height:1.5}
.switchRow{display:flex;align-items:center;justify-content:space-between;padding:7px 0;border-bottom:1px dashed #1e232b}
.switchRow:last-child{border-bottom:0}
.switchRow .sl{font-size:13px;color:#d8dee9}
.badge{font-size:10px;border-radius:999px;padding:2px 8px;border:1px solid #2b3340;color:#9fb0c0}
.badge.on{color:#7fd1ae;border-color:#27503f;background:#16241d}
.badge.off{color:#8b97a4}

/* ===== 弹窗（不使用 inset，兼容旧 iOS） ===== */
#modalRoot{position:fixed;top:0;left:0;right:0;bottom:0;z-index:60;display:none;background:rgba(4,6,8,.78)}
#modalRoot.show{display:block}
.modal{position:absolute;top:50%;left:12px;right:12px;-webkit-transform:translateY(-50%);transform:translateY(-50%);

.modalHead{padding:12px 14px;border-bottom:1px solid #232833;flex:0 0 auto}
.modalHead h2{margin:0;font-size:16px;color:#e6edf3}

.modalBody{padding:12px 14px;overflow-y:auto;-webkit-overflow-scrolling:touch;flex:1 1 auto}
.modalFoot{padding:10px 14px;border-top:1px solid #232833;flex:0 0 auto}
.story{color:#c3ccd6;font-size:14px;margin:0 0 10px 0;white-space:pre-wrap}
.choice{background:#1a1f28;border:1px solid #2b3340;border-radius:10px;padding:11px;margin:8px 0;cursor:pointer}
.choice:active{background:#222a35}
.choice .t{font-size:14px;color:#d8dee9;font-weight:600}
.choice .d{font-size:11px;color:#7b8794;margin-top:3px}
.tagEra{display:inline-block;font-size:10px;color:#f0c674;border:1px solid #4d4326;background:#241f12;border-radius:4px;padding:1px 5px;margin-right:5px}

/* ===== toast ===== */
#toast{position:fixed;left:50%;bottom:96px;z-index:90;-webkit-transform:translateX(-50%);transform:translateX(-50%);
  background:rgba(20,24,30,.96);border:1px solid #2b3340;color:#d8dee9;border-radius:10px;
  padding:9px 14px;font-size:13px;max-width:88%;display:none;text-align:center}
#toast.show{display:block}

/* ===== 天赋卡 ===== */
.talentCard{background:#171c24;border:1px solid #2b3340;border-radius:12px;padding:12px;margin:8px 0;cursor:pointer}
.talentCard.sel{border-color:#2b8c68;background:#16241d}
.talentCard .tn{font-size:15px;font-weight:600;color:#e6edf3}
.talentCard .td{font-size:12px;color:#8b97a4;margin-top:4px}
.talentCard .tm{font-size:11px;color:#7fd1ae;margin-top:6px;font-variant-numeric:tabular-nums}

/* ===== 列表 ===== */
.listItem{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-bottom:1px dashed #1e232b}
.listItem:last-child{border-bottom:0}
.listItem .li-main{min-width:0}
.listItem .li-name{font-size:13px;color:#d8dee9}
.listItem .li-sub{font-size:11px;color:#6b7684}
.listItem .li-right{font-size:12px;color:#7fd1ae;white-space:nowrap}

.scrollBox{max-height:230px;overflow-y:auto;-webkit-overflow-scrolling:touch}
.logItem{font-size:12px;color:#8b97a4;padding:4px 0;border-bottom:1px dashed #1c2129}

input.inp{width:100%;padding:11px;border-radius:10px;background:#101319;border:1px solid #2b3340;color:#e6edf3;font-size:16px}
.center-note{text-align:center;color:#6b7684;font-size:12px;padding:18px 8px}
.big{font-size:22px;font-weight:700;color:#e6edf3;font-variant-numeric:tabular-nums}
</style>
</head>

      for (var k in mod) {
        if (Object.prototype.hasOwnProperty.call(mod, k) && s.attrs[k] !== undefined) {
          s.attrs[k] += mod[k];
        }
      }
    }
    /* 轮回继承（少量属性） */
    var inh = TL.global.inherit || {};
    for (var a in inh) {
      if (Object.prototype.hasOwnProperty.call(inh, a) && s.attrs[a] !== undefined) { s.attrs[a] += inh[a]; }
    }
    /* 城市 attrEffect：压力修正 + 财富上限系数 */
    s.attrs['压力值'] = TL.clamp(s.attrs['压力值'] + (cityObj.attrEffect['压力值'] || 0), 0, 999);
    s.lifespan = TL.calcLifespan(s);
    return s;
  };

  TL.calcLifespan = function (s) {
    var base = 62 + Math.round(s.attrs['体质'] * 0.35) + Math.round(s.attrs['健康值'] * 0.25);
    /* 天赋对寿命的影响 */
    for (var i = 0; i < s.talents.length; i++) {
      var n = s.talents[i].name;
      if (n === '长寿体质') { base += 12; }
      if (n === '短命基因') { base -= 12; }
      if (n === '打不死的小强') { base += 6; }
    }
    return TL.clamp(base + TL.rnd(17) - 8, 35, 110);
  };

  TL.cityByName = function (name) {
    for (var i = 0; i < TL.DATA.city.length; i++) {
      if (TL.DATA.city[i].cityName === name) { return TL.DATA.city[i]; }
    }
    return null;
  };
  TL.city = function () { return TL.cityByName(TL.S.cityName) || TL.DATA.city[0]; };

  /* 财富上限：城市 attrEffect.财富上限 系数 * 基础额度 */
  TL.moneyCap = function () {
    var f = TL.city().attrEffect['财富上限'];
    if (!f || f <= 0) { f = 1; }
    return Math.round(300000 * f);
  };

  /* ---------------- 技能加成（事件成功率） ---------------- */

  /* 根据事件/选项文本计算技能带来的成功率加成（0 ~ 0.35） */
  TL.skillBonus = function (text) {
    if (!text || !TL.S) { return 0; }
    var bonus = 0;
    for (var i = 0; i < TL.S.skills.length; i++) {
      var id = TL.S.skills[i];
      var words = TL.SKILL_KEYWORDS[id];
      if (!words) { continue; }
      for (var j = 0; j < words.length; j++) {
        if (text.indexOf(words[j]) !== -1) { bonus += 0.07; break; }
      }
    }
    /* 天赋加成 */
    for (var k = 0; k < TL.S.talents.length; k++) {
      var tn = TL.S.talents[k].name;
      if (tn === '天资聪颖' || tn === '学霸体质' || tn === '社交达人' || tn === '商业嗅觉' ||
        tn === '投资直觉' || tn === '天生嗓音' || tn === '艺术天赋' || tn === '运动奇才' ||
        tn === '小镇做题家' || tn === '夜猫子') { bonus += 0.05; }
      if (tn === '拖延症') { bonus -= 0.08; }
      if (tn === '手气极差') { bonus -= 0.10; }
      if (tn === '法盲') { bonus += 0.0; }
    }
    if (bonus < 0) { bonus = 0; }
    if (bonus > 0.35) { bonus = 0.35; }
    return bonus;
  };

  /* ---------------- 属性变更 ---------------- */
  TL.applyAttr = function (change, noToast) {
    var s = TL.S; if (!s) { return null; }
    var applied = {};
    for (var i = 0; i < TL.ATTRS.length; i++) {
      var k = TL.ATTRS[i];
      var d = change[k] || 0;
      if (d === 0) { continue; }
      /* 城市财富上限：财富不能突破上限（金手指除外） */
      if (k === '财富') {
        var cap = TL.moneyCap();
        var after = s.attrs['财富'] + d;
        if (d > 0 && after > cap) { d = Math.max(0, cap - s.attrs['财富']); }
      }
      /* 天赋抵抗 */
      if (k === '压力值' && d > 0) {
        for (var t = 0; t < s.talents.length; t++) {
          var tn = s.talents[t].name;
          if (tn === '抗压强者' || tn === '钢铁意志' || tn === '乐天派') { d = Math.round(d * 0.6); }
          if (tn === '玻璃心') { d = Math.round(d * 1.5); }
        }
      }
      if (k === '成瘾值' && d > 0) {
        for (var t2 = 0; t2 < s.talents.length; t2++) {
          var tn2 = s.talents[t2].name;
          if (tn2 === '抗瘾体质') { d = Math.round(d * 0.5); }
          if (tn2 === '赌徒本性' && TL.S.addictions['赌瘾'] > 0) { d = Math.round(d * 1.4); }
        }
      }
      s.attrs[k] += d;
      applied[k] = d;
      /* 单次财富暴涨（≥5万）用于「一夜暴富 / 股神」成就 */
      if (k === '财富' && d >= 50000) { s.flags.bigGain = 1; s.stat.income += d; }
    }
    /* 夹取范围 */
    for (var j = 0; j < TL.ATTRS.length; j++) {
      var key = TL.ATTRS[j];
      if (key === '财富') { continue; }
      s.attrs[key] = TL.clamp(s.attrs[key], -99, 200);
    }
    if (s.attrs['财富'] > s.stat.maxMoney) { s.stat.maxMoney = s.attrs['财富']; }
    if (!noToast) { TL.toastAttr(applied); }
    TL.checkAchievements();
    return applied;
  };

  TL.toastAttr = function (applied) {
    var parts = [];
    for (var k in applied) {
      if (!Object.prototype.hasOwnProperty.call(applied, k)) { continue; }
      var v = applied[k];
      parts.push(k + (v > 0 ? '+' : '') + (k === '财富' ? TL.fmt(v) : v));
    }
    if (parts.length) { window.toast(parts.join('  ')); }
  };

  /* ---------------- 事件标记解析 ---------------- */
  /* desc 里形如 【买房】【入狱:3】【关系:friend:小林】 的标记，是剧情副作用钩子 */
  TL.parseMarkers = function (text) {
    var out = [];
    if (!text || typeof text !== 'string') { return out; }
    var re = /【([^】]+)】/g, m;
    while ((m = re.exec(text)) !== null) {
      var body = m[1];
      /* 年代标记 【80年代】 也在这里兼容 */
      var eraM = /^(80|90|00|10|20)年代$/.exec(body);
      if (eraM) { out.push({ type: '年代', args: [eraM[1]] }); continue; }
      var parts = body.split(':');
      out.push({ type: parts[0], args: parts.slice(1) });
    }
    return out;
  };

  TL.applyMarkers = function (text) {
    var s = TL.S; if (!s) { return; }
    var ms = TL.parseMarkers(text);
    for (var i = 0; i < ms.length; i++) {
      var t = ms[i].type, a = ms[i].args;
      try {
        if (t === '习得') { TL.learnSkill(a[0]); }
        else if (t === '宠物') { TL.addPet(a[0]); }
        else if (t === '宠物生病') { TL.petEvent('生病'); }
        else if (t === '宠物走失') { TL.petEvent('走失'); }
        else if (t === '宠物繁育') { TL.petEvent('繁育'); }
        else if (t === '宠物离世') { TL.petEvent('离世'); }
        else if (t === '关系') { TL.addRelation(a[0], a[1]); }
        else if (t === '关系结束') { TL.endRelation(a[0]); }
        else if (t === '职业') { s.job = a[0]; s.salary = TL.baseSalary(a[0], s); s.flags.jobFirst = 1; TL.unlock('打工人'); }
        else if (t === '升职') { s.salary = Math.round(s.salary * 1.4) || 8000; s.flags.promoted = 1; TL.unlock('职场晋升'); }
        else if (t === '失业') { s.job = ''; s.salary = 0; s.flags.fired = 1; TL.unlock('被优化了'); }
        else if (t === '跳槽') { s.salary = Math.round(s.salary * 1.3) || 9000; s.flags.jobHop = 1; TL.unlock('跳槽高手'); }
        else if (t === '创业') { s.flags.startup = 1; }
        else if (t === '破产') { s.flags.bankrupt = 1; s.job = ''; s.salary = 0; TL.unlock('公司破产'); }
        else if (t === '入狱') { TL.jail(parseInt(a[0], 10) || 1); }
        else if (t === '出狱') { s.prison = 0; s.flags.record = 1; }
        else if (t === '案底') { s.flags.record = 1; }
        else if (t === '减刑') { s.prison = Math.max(0, s.prison - 1); s.flags.commuted = 1; TL.unlock('减刑出狱'); }
        else if (t === '买房') { s.assets.house += 1; TL.unlock('有房一族'); }
        else if (t === '买车') { s.assets.car += 1; TL.unlock('有车一族'); }
        else if (t === '奢侈品') { s.assets.luxury += 1; }
        else if (t === '保险') { s.assets.insurance += 1; }
        else if (t === '负债') { s.assets.debt += (parseInt(a[0], 10) || 0); }
        else if (t === '还债') { s.assets.debt = Math.max(0, s.assets.debt - (parseInt(a[0], 10) || 0)); }
        else if (t === '成瘾') { TL.addAddiction(a[0], 10); }
        else if (t === '戒断') { TL.rehab(a[0]); }
        else if (t === '年代') { s.flags.eraSeen[a[0]] = 1; }
      } catch (e) { /* 单个标记失败不影响整局 */ }
    }
    /* 资产/债务相关的通用成就 */
    if (s.assets.debt >= 100000) { TL.unlock('负债累累'); }
    if (s.assets.debt === 0 && s.flags.wasDebt) { TL.unlock('无债一身轻'); }
    if (s.assets.debt >= 50000) { s.flags.wasDebt = 1; }
  };

  /* ---------------- 技能 / 宠物 / 人际 / 成瘾 / 牢狱 ---------------- */
  TL.learnSkill = function (id) {

  TL.skillName = function (id) {

  TL.skillById = function (id) {

  var PET_NAMES = ['豆豆', '团子', '小黑', '旺财', '雪球', '布丁', '橘座', '毛球', '阿黄', '奶昔'];
  TL.addPet = function (species) {
    var s = TL.S;
    var p = { name: TL.pick(PET_NAMES), species: species || '猫', age: 0, alive: true, health: 90 };
    s.pets.push(p);

  };
  TL.petEvent = function (kind) {
    var s = TL.S;
    var alive = [];
    for (var i = 0; i < s.pets.length; i++) { if (s.pets[i].alive) { alive.push(s.pets[i]); } }
    if (!alive.length) { return; }
    var p = TL.pick(alive);
    if (kind === '生病') { p.health -= 25; TL.unlock('宠物医院常客'); window.toast(p.name + ' 生病了'); }
    else if (kind === '走失') { p.alive = false; p.lost = true; window.toast(p.name + ' 走失了'); }
    else if (kind === '繁育') { TL.addPet(p.species); TL.addPet(p.species); TL.unlock('毛孩子满堂'); }
    else if (kind === '离世') { p.alive = false; TL.unlock('回喵星了'); window.toast(p.name + ' 离开了你'); }
  };

  TL.addRelation = function (type, name) {
    var s = TL.S;
    if (!TL.REL_TYPES[type] || !name) { return; }
    for (var i = 0; i < s.relations.length; i++) {
      if (s.relations[i].name === name) {
        s.relations[i].affinity = TL.clamp(s.relations[i].affinity + 10, 0, 100);
        return;
      }
    }
    var base = (type === 'enemy') ? 20 : 60;
    s.relations.push({ name: name, type: type, affinity: base, alive: true, since: s.age });
    if (type === 'lover' && s.age <= 18) { TL.unlock('青梅竹马'); }
    window.toast('新增关系：' + TL.REL_TYPES[type] + ' ' + name);
  };
  TL.endRelation = function (name) {
    var s = TL.S;
    for (var i = 0; i < s.relations.length; i++) {
      if (s.relations[i].name === name) {
        s.relations[i].alive = false;
        s.relations[i].affinity = 0;
        window.toast('关系结束：' + name);
      }
    }
  };
  TL.relCount = function (type) {
    var s = TL.S, n = 0;
    for (var i = 0; i < s.relations.length; i++) {
      if (s.relations[i].type === type && s.relations[i].alive !== false) { n++; }
    }
    return n;
  };

  TL.addAddiction = function (type, v) {
    var s = TL.S;
    if (!type || !s) { return; }
    if (s.addictions[type] === undefined) { s.addictions[type] = 0; }
    s.addictions[type] = TL.clamp(s.addictions[type] + v, 0, 100);
  };
  TL.rehab = function (type) {
    var s = TL.S;
    if (!type) { return; }
    var before = s.addictions[type] || 0;
    if (before >= 80) { TL.unlock('戒断地狱'); }

    if (type === '网瘾') { TL.unlock('网瘾戒断'); }

  TL.jail = function (years) {
    var s = TL.S;
    if (!s) { return; }
    years = TL.clamp(years || 1, 1, 20);
    s.prison += years;
    s.stat.prisonTotal += years;
    s.stat.crimeCaught += 1;

  TL.baseSalary = function (job, s) {
    var base = 6000;
    var table = {
      '程序员': 22000, '大厂程序员': 30000, '国企职员': 9000, '工厂普工': 5500, '外卖骑手': 7000,
      '网约车司机': 7500, '教师': 8000, '公务员': 8500, '汽修工': 7000, '销售': 9000,
      '部门主管': 26000, '创业者': 0, '店主': 8000, '理发师': 6500, '电焊工': 11000,
      '护士': 8000, '电商运营': 12000, '主播': 10000, '作家': 7000, '快递员': 6000
    };
    if (table[job] !== undefined) { base = table[job]; }
    var f = TL.city().attrEffect['财富上限'] || 1;
    var intel = s ? (s.attrs['智力'] / 50) : 1;
    var skillMul = 1 + s.skills.length * 0.03;
    return Math.round(base * f * (0.7 + intel * 0.3) * skillMul);
  };

  /* ---------------- 每年推进 ---------------- */
  TL.naturalDrift = function () {
    var s = TL.S, d = {};
    for (var i = 0; i < TL.ATTRS.length; i++) { d[TL.ATTRS[i]] = 0; }
    if (s.age <= 6) { d['智力'] = 1; d['体质'] = 1; d['健康值'] = 1; d['快乐'] = 1; }
    else if (s.age <= 17) { d['智力'] = 1; d['体质'] = 1; d['压力值'] = 1; }
    else if (s.age <= 39) { d['压力值'] = 1; }
    else if (s.age <= 59) { d['体质'] = -1; d['健康值'] = -1; d['压力值'] = -1; }
    else { d['体质'] = -1; d['健康值'] = -2; d['压力值'] = -2; d['快乐'] = -1; }
    /* 自愈：年轻/心态好时恢复更快（避免随机选择下人均英年早逝） */
    var hp = s.attrs['健康值'];
    if (hp < 40) { d['健康值'] += 3; }
    else if (hp < 60 && s.attrs['压力值'] < 60) { d['健康值'] += 2; }
    else if (hp < 85 && s.age <= 45 && s.attrs['快乐'] >= 50) { d['健康值'] += 1; }
    /* 成瘾值自然代谢 + 健康损耗 */
    if (s.attrs['成瘾值'] > 0) { d['成瘾值'] = -1; }
    if (s.attrs['成瘾值'] >= 50) { d['健康值'] -= 1; }
    if (s.attrs['压力值'] >= 70) { d['健康值'] -= 2; }
    if (s.attrs['快乐'] >= 70) { d['健康值'] += 1; }
    /* 天赋被动 */
    for (var t = 0; t < s.talents.length; t++) {
      var n = s.talents[t].name;
      if (n === '睡眠质量王') { d['健康值'] += 2; d['压力值'] -= 2; }
      if (n === '铁胃') { d['体质'] += 1; }
      if (n === '天生劳碌命') { d['健康值'] -= 1; }
      if (n === '夜猫子') { d['健康值'] -= 1; }
      if (n === '晚熟之人' && s.age >= 40) { d['智力'] += 2; d['财富'] += 3000; }
    }
    /* 技能被动 */
    if (TL.has(s.skills, 'fitness')) { d['体质'] += 1; d['健康值'] += 1; }
    if (TL.has(s.skills, 'meditation')) { d['压力值'] -= 2; }
    if (TL.has(s.skills, 'gardening') && s.age >= 50) { d['压力值'] -= 1; d['快乐'] += 1; }
    if (TL.has(s.skills, 'budgeting')) { d['财富'] += 2000; }
    /* 压力过高伤身、快乐过低伤心 */
    if (s.attrs['压力值'] >= 85) { d['健康值'] -= 3; }
    if (s.attrs['快乐'] <= 15) { d['健康值'] -= 2; }
    return d;
  };

  TL.yearlyIncome = function () {
    var s = TL.S;
    if (s.prison > 0 || !s.job || !s.salary) { return 0; }
    var inc = Math.round(s.salary * (0.9 + Math.random() * 0.25));
    /* 「休息放松」行动会让当年收入减半 */
    if (s.flags.halfIncome) { inc = Math.round(inc * 0.5); }
    /* 城市财富上限：年收入软上限 */
    var cap = Math.round(TL.moneyCap() * 0.25);
    if (inc > cap) { inc = cap; }
    if (s.flags.record) { inc = Math.round(inc * 0.7); } /* 案底惩罚 */
    s.stat.income += inc;
    return inc;

        if (s.flags.lastHpYear !== s.age) { s.flags.lastHpYear = s.age; s.flags.lowHp = (s.flags.lowHp || 0) + 1; }
      }
      return (s.flags.lowHp || 0) >= 3;
    },
    '久病成医': function (s) { return TL.logCount('住院') >= 3; },
    'ICU奇迹': function (s) {
      if (TL.logHas('ICU') || TL.logHas('重症')) { s.flags.icu = 1; }
      return !!s.flags.icu && s.attrs['健康值'] >= 50;
    },
    '与遗传病共存': function (s) { return TL.logHas('遗传病') && s.attrs['健康值'] >= 60; },
    '理财达人': function (s) { return s.stat.income >= 100000 && TL.has(s.skills, 'finance'); },
    '时代见证者': function (s) {
      var n = 0;
      for (var i = 0; i < TL.ERAS.length; i++) { if (s.flags.eraSeen[TL.ERAS[i]]) { n++; } }
      return n >= 5;
    },
    '互联网原住民': function (s) {
      return !!(s.flags.eraSeen['00'] && s.flags.eraSeen['10'] && s.flags.eraSeen['20']);
    },
    '洗心革面': function (s) {
      if (s.flags.record && !s.flags.recordAge) { s.flags.recordAge = s.age; }
      return !!s.flags.record && s.attrs['罪恶值'] <= 5 && (s.age - (s.flags.recordAge || s.age)) >= 10;
    },
    '五毒俱全': function (s) {
      var n = 0;
      for (var i = 0; i < TL.ADDICTIONS.length; i++) {
        if ((s.addictions[TL.ADDICTIONS[i]] || 0) >= 50) { n++; }
      }
      return n >= 4;
    },
    '退休生活': function (s) { return s.age >= 60; }
  };

  /* ---------------- 主检查入口 ---------------- */
  TL.checkAchievements = function () {
    var s = TL.S;
    if (!s) { return; }
    try {
      var name, i;
      for (name in TL.ACH_RULES) {
        if (!Object.prototype.hasOwnProperty.call(TL.ACH_RULES, name)) { continue; }
        if (TL.isUnlocked(name)) { continue; }
        try { if (TL.ACH_RULES[name](s)) { TL.unlock(name); } } catch (e) { }
      }
      for (i = 0; i < TL.LOG_ACH.length; i++) {
        var item = TL.LOG_ACH[i];
        if (TL.isUnlocked(item.name)) { continue; }
        var hit = false;
        for (var j = 0; j < item.kws.length; j++) {
          if (TL.logHas(item.kws[j])) { hit = true; break; }
        }
        if (hit && item.extra && !item.extra(s)) { hit = false; }
        if (hit) { TL.unlock(item.name); }
      }
      if (s.assets.debt >= 50000) { s.flags.wasDebt = 1; }
    } catch (e) { }
  };

  TL.achStats = function () {
    var total = TL.DATA.achievements.length;
    var got = 0;
    for (var i = 0; i < TL.DATA.achievements.length; i++) {
      if (TL.isUnlocked(TL.DATA.achievements[i].name)) { got++; }
    }
    return { got: got, total: total };
  };
})();

/* ===== 03_ai.js ===== */
/* =========================================================================
 * TrollLifeAI · AI 剧情引擎（可配置的 OpenAI 兼容接口）
 *
 * 设计原则：
 *   1) 接口完全可配置：地址 / 模型 / Key / 频率 / 每次人生上限，默认 DeepSeek 官方端点；
 *   2) Key 只存在本机 localStorage（键 tlai_ai_v1），**绝不写进 app.html**，避免推公开仓库泄漏；
 *   3) file:// 页面直连会被 CORS 拦，App 内优先走壳的 nativeHttp POST 通道，浏览器里回退 fetch；
 *   4) AI 只负责「生成一条剧情」，能不能落地由本地引擎校验：结构不对 / 属性越界 / 超时 → 自动回退本地事件池。
 * ========================================================================= */
(function () {
  'use strict';

  TL.ai = {};

  TL.AI_KEY = 'tlai_ai_v1';

  /* ---------------- 配置 ---------------- */
  TL.ai.DEFAULTS = {
    enabled: false,
    url: 'https://api.deepseek.com/v1/chat/completions',
    model: 'deepseek-chat',
    key: '',
    chance: 0.35,        /* 每年触发 AI 续写的概率 */
    maxPerLife: 30,      /* 每世最多请求次数（省钱） */
    timeout: 45000,      /* 超时毫秒 */
    jsonMode: true,      /* 是否带 response_format: json_object */
    startAge: 6          /* 从这个年龄开始才用 AI（童年留白） */
  };

  TL.ai.config = null;

  TL.ai.getConfig = function () {
    if (TL.ai.config) { return TL.ai.config; }
    var c = {};
    var k;
    for (k in TL.ai.DEFAULTS) {
      if (Object.prototype.hasOwnProperty.call(TL.ai.DEFAULTS, k)) { c[k] = TL.ai.DEFAULTS[k]; }
    }
    try {
      var raw = localStorage.getItem(TL.AI_KEY);
      if (raw) {
        var o = JSON.parse(raw);
        for (k in o) {
          if (Object.prototype.hasOwnProperty.call(o, k) && c[k] !== undefined) { c[k] = o[k]; }
        }
      }
    } catch (e) { }
    c.chance = TL.clamp(Number(c.chance) || 0, 0, 1);
    c.maxPerLife = TL.clamp(parseInt(c.maxPerLife, 10) || 30, 0, 500);
    c.timeout = TL.clamp(parseInt(c.timeout, 10) || 45000, 3000, 120000);
    TL.ai.config = c;
    return c;
  };

  TL.ai.setConfig = function (patch) {
    var c = TL.ai.getConfig();
    for (var k in patch) {
      if (Object.prototype.hasOwnProperty.call(patch, k)) { c[k] = patch[k]; }
    }
    /* 写入时也做一次范围归一化，避免界面显示值与实际生效值不一致 */
    c.chance = TL.clamp(Number(c.chance) || 0, 0, 1);
    c.maxPerLife = TL.clamp(parseInt(c.maxPerLife, 10) || 30, 0, 500);
    c.timeout = TL.clamp(parseInt(c.timeout, 10) || 45000, 3000, 120000);
    c.startAge = TL.clamp(parseInt(c.startAge, 10) || 0, 0, 100);
    TL.ai.config = c;
    try { localStorage.setItem(TL.AI_KEY, JSON.stringify(c)); } catch (e) { }
    return c;
  };

  TL.ai.ready = function () {
    var c = TL.ai.getConfig();
    return !!(c.enabled && c.url && c.model && c.key);
  };

  TL.ai.status = function () {
    var c = TL.ai.getConfig();
    if (!c.enabled) { return '已关闭'; }
    if (!c.key) { return '缺少 API Key'; }
    if (!c.url) { return '缺少接口地址'; }
    return '已启用（' + c.model + '）';
  };

  /* ---------------- 网络：原生通道优先，浏览器回退 fetch ---------------- */
  window.apiPost = function (url, headers, bodyText, timeout, cb) {
    try {
      if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.nativeHttp) {
        window.__nativeHttpCb = cb;
        window.webkit.messageHandlers.nativeHttp.postMessage({
          url: url, method: 'POST', headers: headers || {}, body: bodyText, timeout: timeout || 60000
        });
        return;
      }
      var done = false;
      var timer = setTimeout(function () {
        if (!done) { done = true; cb('TIMEOUT', null, 0); }
      }, timeout || 60000);
      fetch(url, { method: 'POST', headers: headers || {}, body: bodyText })
        .then(function (r) {
          return r.text().then(function (t) { return { status: r.status, text: t }; });
        })
        .then(function (o) {
          if (done) { return; }
          done = true; clearTimeout(timer); cb(null, o.text, o.status);
        })['catch'](function (e) {
          if (done) { return; }
          done = true; clearTimeout(timer); cb(String(e), null, 0);
        });
    } catch (e) { cb(String(e), null, 0); }
  };

  /* 供壳回传（原生通道） */
  window.__nativeHttpResult = function (err, text, status) {
    try {
      if (typeof window.__nativeHttpCb === 'function') { window.__nativeHttpCb(err, text, status); }
    } catch (e) { }
  };

  /* ---------------- 提示词 ---------------- */
  TL.ai.SYSTEM = [
    '你是一款中文文字人生模拟器（人生重开模拟器）的剧情引擎。',
    '你要根据玩家当前的人生状态，原创一条贴合年龄、年代、城市、职业与属性的剧情事件。',
    '只输出一个 JSON 对象，不要任何解释、不要 markdown 代码块、不要多余文字。',
    'JSON 结构固定为：',
    '{"title":"事件标题","story":"第二人称剧情描述","choices":[{"option_text":"选项","desc":"结果说明","attr_change":{"智力":0,"体质":0,"魅力":0,"财富":0,"快乐":0,"运气":0,"健康值":0,"成瘾值":0,"名声值":0,"压力值":0,"罪恶值":0}}]}',
    '硬性规则：',
    '1. attr_change 必须完整包含 11 个键：智力、体质、魅力、财富、快乐、运气、健康值、成瘾值、名声值、压力值、罪恶值，值必须是整数。',
    '2. 除财富外每项取值范围 -15 到 15；财富取 -30000 到 30000。成瘾值、罪恶值只能取 0 到 20。',
    '3. title 不超过 18 个字，story 60-120 字，choices 2 到 3 个，option_text 不超过 14 个字，desc 不超过 40 字。',
    '4. 选项之间必须有取舍（有得有失），禁止出现只有好处没有代价的选项。',
    '5. 不要使用书名号双引号，需要引号时用「」。',
    '6. desc 末尾可选地追加剧情标记（不要新增 JSON 字段），可用：【习得:skillId】【关系:friend:名字】【关系结束:名字】【职业:岗位】【升职】【失业】【跳槽】【创业】【破产】【入狱:年数】【出狱】【案底】【减刑】【买房】【买车】【负债:金额】【还债:金额】【成瘾:烟瘾】【戒断:酒瘾】【宠物:猫】【宠物离世】，每个 desc 最多 2 个。'
  ].join('\n');

  TL.ai.buildUserPrompt = function (S) {
    var lines = [];
    var c = TL.ai.getConfig();
    lines.push('【当前人生状态】');
    lines.push('年龄：' + S.age + ' 岁');
    lines.push('年代：' + TL.ERA_NAME[S.era] + '；出生城市：' + S.cityName);
    lines.push('职业：' + (S.job ? (S.job + '（月薪 ' + S.salary + '）') : '无业') + (S.prison > 0 ? '，正在服刑（剩余 ' + S.prison + ' 年）' : ''));
    var attrLine = [];
    for (var i = 0; i < TL.ATTRS.length; i++) { attrLine.push(TL.ATTRS[i] + S.attrs[TL.ATTRS[i]]); }
    lines.push('属性：' + attrLine.join('，'));
    if (S.skills.length) {
      var names = [];
      for (var k = 0; k < S.skills.length; k++) { names.push(TL.skillName(S.skills[k])); }
      lines.push('已习得技能：' + names.join('、'));
    }
    if (S.relations.length) {
      var rels = [];
      for (var r = 0; r < S.relations.length && r < 6; r++) {
        var rel = S.relations[r];
        rels.push((TL.REL_TYPES[rel.type] || rel.type) + rel.name + '(好感' + rel.affinity + ')');
      }
      lines.push('重要关系：' + rels.join('、'));
    }
    if (S.pets.length) {
      var pets = [];
      for (var p = 0; p < S.pets.length && p < 3; p++) { pets.push(S.pets[p].name + '(' + S.pets[p].species + ')'); }
      lines.push('宠物：' + pets.join('、'));
    }
    var add = [];
    for (var a in S.addictions) {
      if (Object.prototype.hasOwnProperty.call(S.addictions, a) && S.addictions[a] > 0) {
        add.push(a + S.addictions[a]);
      }
    }
    if (add.length) { lines.push('成瘾：' + add.join('、')); }
    var recent = S.usedTitles.slice(-14);
    if (recent.length) {
      lines.push('');
      lines.push('【最近已经发生过的剧情（不要重复这些主题与标题）】');
      lines.push(recent.join(' / '));
    }
    lines.push('');
    lines.push('【任务】');
    lines.push('请为这个 ' + S.age + ' 岁的人，原创 1 条' + TL.ERA_NAME[S.era] + '背景下、发生在' + S.cityName + '的剧情事件，' +
      '并给出 2-3 个有取舍的选项与完整的 11 项属性变化。只输出 JSON。');
    if (S.age <= 6) { lines.push('注意：这是幼儿阶段，剧情要贴近童年日常。'); }
    else if (S.age <= 17) { lines.push('注意：这是学生阶段，剧情要贴近校园与家庭。'); }
    else if (S.age >= 60) { lines.push('注意：这是老年阶段，剧情要贴近健康、养老与家庭。'); }
    return lines.join('\n');
  };

  /* ---------------- 响应解析与校验 ---------------- */
  function extractJson(text) {
    if (!text || typeof text !== 'string') { return null; }
    var t = text.replace(/```json/gi, '```').replace(/```/g, '').trim();
    var i = t.indexOf('{'), j = t.lastIndexOf('}');
    if (i === -1 || j === -1 || j <= i) { return null; }
    t = t.slice(i, j + 1);
    try { return JSON.parse(t); } catch (e) { }
    /* 常见问题兜底：去掉尾随逗号再试一次 */
    try { return JSON.parse(t.replace(/,\s*([}\]])/g, '$1')); } catch (e2) { }
    return null;
  }
  TL.ai.extractJson = extractJson;

  function clampInt(v, lo, hi) {
    var n = Number(v);
    if (!isFinite(n)) { return 0; }
    n = Math.round(n);
    if (n < lo) { n = lo; }
    if (n > hi) { n = hi; }
    return n;
  }
  function clip(str, max) {
    if (str === undefined || str === null) { return ''; }
    var s = String(str).replace(/[""]/g, '「').replace(/[""]/g, '」').replace(/[\r\n]+/g, ' ').trim();
    if (s.length > max) { s = s.slice(0, max); }
    return s;
  }

  /* 把 AI 返回的原始对象规范化成和 event.json 完全一致的结构；不合格返回 null */
  TL.ai.normalizeEvent = function (raw) {
    if (!raw || typeof raw !== 'object') { return null; }
    var title = clip(raw.title, 24);
    var story = clip(raw.story, 260);
    if (!title || !story) { return null; }
    var rawChoices = raw.choices;
    if (!rawChoices || !rawChoices.length) {
      if (raw.options && raw.options.length) { rawChoices = raw.options; } else { return null; }
    }
    var choices = [];
    for (var i = 0; i < rawChoices.length && i < 3; i++) {
      var rc = rawChoices[i] || {};
      var ot = clip(rc.option_text || rc.text || rc.option, 18);
      if (!ot) { continue; }
      var dsc = clip(rc.desc || rc.description || '', 70);
      var src = rc.attr_change || rc.attrChange || rc.attributes || {};
      var ch = {};
      var bad = 0;
      for (var k = 0; k < TL.ATTRS.length; k++) {
        var key = TL.ATTRS[k];
        var v = src[key];
        if (v === undefined || v === null || v === '') { v = 0; }
        var lo = -15, hi = 15;
        if (key === '财富') { lo = -30000; hi = 30000; }
        if (key === '成瘾值' || key === '罪恶值') { lo = 0; hi = 20; }
        var iv = clampInt(v, lo, hi);
        if (String(v) !== String(iv)) { bad++; }
        ch[key] = iv;
      }
      choices.push({ option_text: ot, attr_change: ch, desc: dsc });
    }
    if (!choices.length) { return null; }
    var eraM = /^【?(80|90|00|10|20)年代】?/.exec(title);
    var out = {
      age_range: [TL.S ? TL.S.age : 18, 110],
      title: title,
      story: story,
      choices: choices
    };
    if (eraM) { out.title = eraM[1] + '年代 · ' + title.replace(eraM[0], '').trim(); }
    out.ai = 1;   /* 运行时标记：AI 原创（不会写回 JSON 文件） */
    return out;
  };

  /* ---------------- 发起请求 ---------------- */
  TL.ai.generate = function (cb) {
    var c = TL.ai.getConfig();
    var S = TL.S;
    if (!S) { cb('没有进行中的人生', null); return; }
    if (!TL.ai.ready()) { cb(TL.ai.status(), null); return; }

    var body = {
      model: c.model,
      messages: [
        { role: 'system', content: TL.ai.SYSTEM },
        { role: 'user', content: TL.ai.buildUserPrompt(S) }
      ],
      temperature: 1.1,
      max_tokens: 900,
      stream: false
    };
    if (c.jsonMode) { body.response_format = { type: 'json_object' }; }

    var headers = { 'Content-Type': 'application/json' };
    if (c.key) { headers['Authorization'] = 'Bearer ' + c.key; }

    window.apiPost(c.url, headers, JSON.stringify(body), c.timeout, function (err, text, status) {
      try {
        if (err) { cb('请求失败：' + err, null); return; }
        if (status && (status < 200 || status >= 300)) {
          var hint = text ? String(text).slice(0, 160) : '';
          cb('接口返回 ' + status + (hint ? ('：' + hint) : ''), null);
          return;
        }
        var data = null;
        try { data = JSON.parse(text); } catch (e) { cb('返回内容不是 JSON', null); return; }
        var content = '';
        if (data && data.choices && data.choices.length && data.choices[0].message) {
          content = data.choices[0].message.content || '';
        } else if (data && data.output_text) {
          content = data.output_text;
        } else if (data && data.content) {
          content = data.content;
        }
        if (!content) { cb('返回里没有剧情内容', null); return; }
        var obj = extractJson(content);
        if (!obj) { cb('剧情 JSON 解析失败', null); return; }
        var ev = TL.ai.normalizeEvent(obj);
        if (!ev) { cb('剧情结构不合格（已丢弃）', null); return; }
        cb(null, ev);
      } catch (e) { cb('处理返回时出错：' + e.message, null); }
    });
  };

  /* 是否该用 AI 续写这一年 */
  TL.ai.shouldUse = function () {
    var c = TL.ai.getConfig();
    var S = TL.S;
    if (!S || !c.enabled || !c.key) { return false; }
    if (S.age < c.startAge) { return false; }
    if (!S.ai) { S.ai = { used: 0, fails: 0, cache: [] }; }
    if (S.ai.used >= c.maxPerLife) { return false; }
    if (S.prison > 0) { return false; }
    return Math.random() < c.chance;
  };

  /* 连接自检：发一条极短请求验证 Key / 地址 / 模型 */
  TL.ai.test = function (cb) {
    var c = TL.ai.getConfig();
    if (!c.url || !c.model) { cb('请先填写接口地址与模型'); return; }
    if (!c.key) { cb('请先填写 API Key'); return; }
    var body = {
      model: c.model,
      messages: [{ role: 'user', content: '只回复两个字：通过' }],
      temperature: 0,
      max_tokens: 16,
      stream: false
    };
    window.apiPost(c.url, { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + c.key },
      JSON.stringify(body), Math.min(c.timeout, 20000), function (err, text, status) {
        try {
          if (err) { cb('连接失败：' + err); return; }
          if (status && (status < 200 || status >= 300)) {
            cb('接口返回 ' + status + '：' + String(text || '').slice(0, 120));
            return;
          }
          var d = JSON.parse(text);
          var ctn = (d.choices && d.choices[0] && d.choices[0].message) ? d.choices[0].message.content : '';
          cb(null, '连接成功，模型回复：' + String(ctn).slice(0, 30));
        } catch (e) { cb('返回解析失败：' + e.message); }
      });
  };
})();

/* ===== 04_actions.js ===== */

(function () {

  TL.actionById = function (id) {
    for (var i = 0; i < TL.ACTIONS.length; i++) {
      if (TL.ACTIONS[i].id === id) { return TL.ACTIONS[i]; }
    }
    return null;
  };

    var xing = ['小林', '阿哲', '小雨', '老周', '小美', '阿豪', '小柔', '老陈', '小夏', '阿泽', '小满', '老李', '小舟', '阿敏', '子墨', '佩琪'];
    return TL.pick(xing) + (TL.rnd(3) === 0 ? String(TL.rnd(90) + 10) : '');
  };

  /* 执行一个主动行动 */
  TL.doAction = function (id) {
    var s = TL.S;
    if (!s || !s.alive) { window.toast('当前没有进行中的人生'); return false; }
    if (s.actionPoints <= 0) { window.toast('今年的行动点已经用完了，先过一年吧'); return false; }
    var a = TL.actionById(id);
    if (!a) { window.toast('行动不存在'); return false; }
    var reason = a.need ? a.need(s) : '';
    if (reason) { window.toast('暂时不能做：' + reason); return false; }

    var res = null;
    try { res = a.run(s) || {}; } catch (e) { window.toast('行动执行失败：' + e.message); return false; }

    /* 属性结算（只取已知的 11 项，其它键忽略） */
    var change = {};
    for (var i = 0; i < TL.ATTRS.length; i++) {
      var k = TL.ATTRS[i];
      change[k] = (res.change && res.change[k]) ? res.change[k] : 0;
    }
    TL.applyAttr(change, true);
    if (res.markers) { TL.applyMarkers(res.markers); }
    if (res.flags) {
      for (var f in res.flags) {
        if (Object.prototype.hasOwnProperty.call(res.flags, f)) { s.flags[f] = res.flags[f]; }
      }
    }
    if (res.reduceAddiction && res.reduceAddiction.type) {
      var t = res.reduceAddiction.type;
      s.addictions[t] = TL.clamp((s.addictions[t] || 0) - res.reduceAddiction.value, 0, 100);
    }
    if (res.interactAll) {
      for (var r = 0; r < s.relations.length; r++) {
        if (s.relations[r].alive !== false) {
          s.relations[r].affinity = TL.clamp(s.relations[r].affinity + res.interactAll, 0, 100);
        }
      }
    }

    s.actionPoints -= 1;
    TL.addLog('第 ' + s.age + ' 年（主动行动）：' + (res.log || a.name));
    if (res.toast) { window.toast(res.toast); } else { window.toast(a.name + ' 完成'); }
    TL.checkAchievements();
    TL.checkDeath();
    TL.save();
    return true;
  };

  TL.INTERACTS = {

  TL.canInteract = function (rel, kind) {
    var s = TL.S;
    if (!s || !rel || rel.alive === false) { return '这段关系已经结束了'; }
    if (rel.lastAct === s.age) { return '今年已经互动过了'; }
    var info = TL.INTERACTS[kind];
    if (!info) { return '互动方式不存在'; }
    if (info.cost && s.attrs['财富'] < info.cost) { return '现金不足 ' + TL.fmt(info.cost) + ' 元'; }
    if (kind === 'reconcile' && rel.type !== 'enemy') { return '只有仇人才需要和解'; }
    if (kind === 'propose') {
      if (rel.type !== 'lover') { return '只有恋人才能求婚'; }
      if (TL.relCount('spouse') > 0) { return '你已经有配偶了'; }
    }
    return '';
  };

  TL.interact = function (name, kind) {
    var s = TL.S;
    if (!s || !s.alive) { return false; }
    var rel = null;
    for (var i = 0; i < s.relations.length; i++) {
      if (s.relations[i].name === name) { rel = s.relations[i]; break; }
    }
    if (!rel) { window.toast('找不到这段关系'); return false; }
    var why = TL.canInteract(rel, kind);
    if (why) { window.toast(why); return false; }
    var info = TL.INTERACTS[kind];

    if (info.cost) {
      TL.applyAttr({ '智力': 0, '体质': 0, '魅力': 0, '财富': -info.cost, '快乐': 0, '运气': 0, '健康值': 0, '成瘾值': 0, '名声值': 0, '压力值': 0, '罪恶值': 0 }, true);
    }
    var msg = '';
    if (kind === 'gift') {
      rel.affinity = TL.clamp(rel.affinity + 8, 0, 100);
      msg = '给 ' + name + ' 送了礼物，好感 +8';
    } else if (kind === 'chat') {
      rel.affinity = TL.clamp(rel.affinity + 3, 0, 100);
      TL.applyAttr({ '智力': 0, '体质': 0, '魅力': 1, '财富': 0, '快乐': 2, '运气': 0, '健康值': 0, '成瘾值': 0, '名声值': 0, '压力值': -2, '罪恶值': 0 }, true);
      msg = '和 ' + name + ' 深聊了一次，好感 +3';
    } else if (kind === 'reconcile') {
      if (Math.random() < 0.5) {
        rel.type = 'friend';
        rel.affinity = 55;
        msg = '与 ' + name + ' 冰释前嫌，化敌为友';
      } else {
        rel.affinity = TL.clamp(rel.affinity + 5, 0, 100);
        msg = name + ' 还没完全原谅你，但关系缓和了一些';
      }
    } else if (kind === 'propose') {
      var rate = 0.6 + Math.min(rel.affinity / 400, 0.2);
      if (Math.random() < rate) {
        rel.type = 'spouse';
        rel.affinity = TL.clamp(rel.affinity + 10, 0, 100);
        TL.applyAttr({ '智力': 0, '体质': 0, '魅力': 0, '财富': -10000, '快乐': 12, '运气': 1, '健康值': 2, '成瘾值': 0, '名声值': 3, '压力值': 4, '罪恶值': 0 }, true);
        msg = '求婚成功！' + name + ' 成为了你的配偶';
        TL.unlock('携手一生');
      } else {
        msg = name + ' 拒绝了你的求婚，需要更多相处';
        TL.applyAttr({ '智力': 0, '体质': 0, '魅力': 0, '财富': 0, '快乐': -8, '运气': 0, '健康值': 0, '成瘾值': 0, '名声值': 0, '压力值': 8, '罪恶值': 0 }, true);
      }
    }
    rel.lastAct = s.age;
    TL.addLog('第 ' + s.age + ' 年（关系互动）：' + msg);
    window.toast(msg);
    TL.checkAchievements();
    TL.save();
    return true;
  };

    add('压力值', -a['压力值'] * 0.5);
    add('成瘾值', -a['成瘾值'] * 0.7);
    add('罪恶值', -a['罪恶值'] * 1.2);
    add('财富积累', Math.min(Math.max(a['财富'], 0), 2000000) / 20000);
    add('房产车辆', s.assets.house * 10 + s.assets.car * 5 + s.assets.luxury * 2);
    add('负债', -(s.assets.debt / 50000) * 5);
    add('人际关系', (TL.relCount('friend') + TL.relCount('lover') + TL.relCount('spouse') + TL.relCount('child')) * 3 - TL.relCount('enemy') * 4);
    add('技能', s.skills.length * 3);
    add('成就', TL.achStats().got * 4);
    add('宠物', s.pets.length * 2);

    score = Math.round(score);
    if (score < 0) { score = 0; }
    var title = TL.TITLES[TL.TITLES.length - 1];
    for (var i = 0; i < TL.TITLES.length; i++) {
      if (score >= TL.TITLES[i].min) { title = TL.TITLES[i]; break; }
    }
    return { score: score, title: title, detail: detail };
  };

  /* ===================== 四、存档管理 ===================== */
  TL.SLOT_COUNT = 3;
  TL.slotKey = function (i) { return 'tlai_slot_' + i; };

  TL.saveSlot = function (i) {
    try {
      if (!TL.S) { return '当前没有人生可以保存'; }
      var pack = { savedAt: Date.now(), version: 1, state: TL.S, global: TL.global };
      localStorage.setItem(TL.slotKey(i), JSON.stringify(pack));
      return null;
    } catch (e) { return '保存失败：' + e.message; }
  };
  TL.loadSlot = function (i) {
    try {
      var raw = localStorage.getItem(TL.slotKey(i));
      if (!raw) { return '槽位 ' + i + ' 是空的'; }
      var pack = JSON.parse(raw);
      if (!pack || !pack.state) { return '槽位数据损坏'; }
      TL.S = pack.state;
      if (pack.global) { TL.global = pack.global; }
      TL.saveGlobal();
      TL.save();
      return null;
    } catch (e) { return '读取失败：' + e.message; }
  };
  TL.slotInfo = function (i) {
    try {
      var raw = localStorage.getItem(TL.slotKey(i));
      if (!raw) { return { empty: true }; }
      var pack = JSON.parse(raw);
      var st = pack.state || {};
      return {
        empty: false,
        age: st.age || 0,
        era: st.era || '',
        city: st.cityName || '',
        alive: !!st.alive,
        savedAt: pack.savedAt || 0
      };
    } catch (e) { return { empty: true }; }
  };
  TL.deleteSlot = function (i) {
    try { localStorage.removeItem(TL.slotKey(i)); return null; } catch (e) { return '删除失败'; }
  };
  TL.exportSave = function () {
    try {
      return JSON.stringify({ version: 1, exportedAt: Date.now(), state: TL.S, global: TL.global });
    } catch (e) { return ''; }
  };
  TL.importSave = function (text) {
    try {
      var o = JSON.parse(String(text).trim());
      var st = o.state ? o.state : o;
      if (!st || !st.attrs) { return '不是有效的存档内容'; }
      TL.S = st;
      if (o.global) { TL.global = o.global; TL.saveGlobal(); }
      TL.save();
      return null;
    } catch (e) { return '解析失败：' + e.message; }
  };
})();

/* ===== 05_ui.js ===== */
/* =========================================================================
 * TrollLifeAI · 界面层
 * 规则：
 *  - 动态 DOM 一律用内联 onclick 调用 window.ui 上的方法，所有处理函数挂在 window 上；
 *  - 确认弹窗用全局变量 __confirm 存 {fn,args}，确定键统一走 window.doConfirmOK()；
 *  - 所有业务外层 try-catch，任何改动都给 toast 反馈；
 *  - 长列表弹窗：标题固定顶部 / 内容独立滚动 / 按钮固定底部。
 * ========================================================================= */
(function () {
  'use strict';

  var ui = {};
  window.ui = ui;

  ui.tab = 'home';
  ui.currentEvent = null;      /* 当前事件（避免用闭包传参） */
  ui.startEra = '00';
  ui.startCity = '二线城市';
  ui.drawnTalents = [];
  ui.pickedTalent = -1;
  ui.rerollLeft = 3;
  ui.startMode = 'new';        /* new | reincarnate */
  ui.achFilter = 'all';        /* all | got | locked */
  ui.busy = false;
  ui.currentEventIsAi = false; /* 当前弹窗里的事件是否由 AI 生成 */
  ui.aiState = null;           /* AI 请求进行中的状态（避免闭包丢参） */
  ui.saveTab = 0;

  /* ---------------- 小工具 ---------------- */
  function esc(t) {
    if (t === undefined || t === null) { return ''; }
    return String(t).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }
  function $(id) { return document.getElementById(id); }
  /* 展示用文本：把引擎使用的剧情标记【…】去掉，玩家不该看到内部约定 */
  function stripMarks(t) {
    if (t === undefined || t === null) { return ''; }
    return String(t).replace(/【[^】]*】/g, '').replace(/\s{2,}/g, ' ').trim();
  }
  function cls(v) { return v > 0 ? 'up' : (v < 0 ? 'down' : 'zero'); }
  function sign(v) { return (v > 0 ? '+' : '') + TL.fmt(v); }

  window.toast = function (msg) {
    try {
      var t = $('toast');
      t.innerHTML = esc(msg);
      t.className = 'show';
      if (window.__toastTimer) { clearTimeout(window.__toastTimer); }
      window.__toastTimer = setTimeout(function () { t.className = ''; }, 2200);
    } catch (e) { }
  };

  function openModal(title, sub, body, foot) {
    try {
      $('mTitle').innerHTML = title;
      $('mSub').innerHTML = sub || '';
      $('mBody').innerHTML = body || '';
      $('mFoot').innerHTML = foot || '';
      $('mBody').scrollTop = 0;
      $('modalRoot').className = 'show';
    } catch (e) { window.toast('弹窗打开失败'); }
  }
  function closeModal() { try { $('modalRoot').className = ''; } catch (e) { } }
  ui.closeModal = closeModal;

  /* ---------------- 确认弹窗（全局变量，不用闭包） ---------------- */
  window.__confirm = null;
  ui.ask = function (title, text, fnName, args) {
    window.__confirm = { fn: fnName, args: args || [] };
    openModal(esc(title), '', '<div class="story">' + esc(text) + '</div>',
      '<div class="btnRow">' +
      '<button class="btn ghost" onclick="window.doConfirmCancel()">取消</button>' +
      '<button class="btn warn" onclick="window.doConfirmOK()">确定</button></div>');
  };
  /* 解析 'ui.doGiveUp' 这类带命名空间的函数名。
     历史 bug：以前用 window['ui.doGiveUp'] 取值，永远取不到（点在 window.ui 上），
     导致所有确认弹窗都报「动作丢失」（放弃本世/转世、清空存档、解锁全部成就都失效）。 */
  function resolveAction(path) {
    try {
      var parts = String(path || '').split('.');
      var obj = window, fn = null, ctx = null;
      for (var i = 0; i < parts.length; i++) {
        if (!obj) { return null; }
        ctx = obj;
        fn = obj[parts[i]];
        obj = fn;
      }
      if (typeof fn !== 'function') { return null; }
      return { fn: fn, ctx: ctx };
    } catch (e) { return null; }
  }

  window.doConfirmOK = function () {
    var c = window.__confirm;
    if (!c) { return; }
    try {
      var target = resolveAction(c.fn);
      if (target) { target.fn.apply(target.ctx, c.args || []); }
      else { window.toast('动作丢失：' + c.fn); }
    } catch (e) { window.toast('执行失败：' + e.message); }
    /* 注意：先执行，再关闭弹窗；关闭时不提前清空回调变量 */
    closeModal();
    window.__confirm = null;
  };
  window.doConfirmCancel = function () { closeModal(); window.__confirm = null; };

  /* ---------------- 视图切换 ---------------- */
  ui.go = function (tab) {
    try {
      ui.tab = tab;
      render();
      $('screen').scrollTop = 0;
    } catch (e) { window.toast('页面切换失败'); }
  };

  function navVisible(v) {
    $('nav').className = v ? 'safe-bottom' : 'hide';
    $('screen').className = v ? '' : 'noNav';
    syncLayout();
  }

  /* 用实测高度修正内容区上下留白：
     顶栏高度 = 刘海安全区 + 44pt；底部导航高度同理。
     不做这一步，iPhone 上每页第一行文字会被顶栏盖住。 */
  function syncLayout() {
    try {
      var topbar = $('topbar'), nav = $('nav'), screen = $('screen');
      if (!topbar || !screen) { return; }
      var topH = topbar.offsetHeight || 44;
      var navH = 0;
      if (nav && nav.className.indexOf('hide') === -1) { navH = nav.offsetHeight || 48; }
      screen.style.paddingTop = (topH + 10) + 'px';
      screen.style.paddingBottom = navH > 0 ? (navH + 12) + 'px' : '16px';
    } catch (e) { }
  }
  ui.syncLayout = syncLayout;
  function setTop(age, era) {
    $('chipAge').innerHTML = age === null ? '年龄 --' : ('年龄 ' + age + ' 岁');
    $('chipEra').innerHTML = era ? ('年代 ' + TL.ERA_NAME[era]) : '年代 --';
  }

  function render() {
    var S = TL.S;
    syncLayout();
    if (ui.tab !== 'start' && (!S || !S.alive)) {
      if (S && !S.alive && ui.tab !== 're') { ui.tab = 're'; }
    }
    if (ui.tab === 'start') { navVisible(false); setTop(null, ui.startEra); viewStart(); return; }
    navVisible(true);
    setTop(S ? S.age : null, S ? S.era : '');
    var tabs = ['home', 'ai', 'skill', 'ach', 're', 'god'];
    for (var i = 0; i < tabs.length; i++) {
      $('tab_' + tabs[i]).className = 'tab' + (ui.tab === tabs[i] ? ' on' : '');
    }
    if (ui.tab === 'home') { viewHome(); }
    else if (ui.tab === 'ai') { viewAi(); }
    else if (ui.tab === 'skill') { viewSkill(); }
    else if (ui.tab === 'ach') { viewAch(); }
    else if (ui.tab === 're') { viewRe(); }
    else { viewGod(); }
  }
  ui.render = render;

  /* ---------------- 开局 / 转世页 ---------------- */
  function viewStart() {
    var html = '';
    var reinc = ui.startMode === 'reincarnate';
    html += '<div class="card"><h3>' + (reinc ? '转世重生' : '人生重开') + '<span class="tail">TrollLifeAI</span></h3>' +
      '<div class="muted">选择出生年代与城市，抽取天赋后开启这一世。' +
      (reinc ? '上一世的少量属性已作为「前世余荫」继承。' : '') + '</div></div>';

    /* 年代 */
    html += '<div class="card"><h3>① 选择出生年代</h3><div class="grid3">';
    for (var i = 0; i < TL.ERAS.length; i++) {
      var e = TL.ERAS[i];
      html += '<button class="btn sm ' + (ui.startEra === e ? 'primary' : '') + '" onclick="window.ui.setEra(\'' + e + '\')">' + TL.ERA_NAME[e] + '</button>';
    }
    html += '</div><div class="tiny">不同年代会解锁专属的公共大事件，影响机遇、薪资与社会环境。</div></div>';

    /* 城市 */
    html += '<div class="card"><h3>② 选择出生城市</h3>';
    for (var c = 0; c < TL.DATA.city.length; c++) {
      var city = TL.DATA.city[c];
      var ok = !!city.eraFactor[ui.startEra];
      html += '<div class="choice ' + (ui.startCity === city.cityName ? 'sel' : '') + '"' +
        (ok ? ' onclick="window.ui.setCity(\'' + esc(city.cityName) + '\')"' : '') +
        (ui.startCity === city.cityName ? ' style="border-color:#2b8c68"' : '') + '>' +
        '<div class="t">' + esc(city.cityName) + (ok ? '' : ' <span class="tiny">（该年代暂未开放）</span>') + '</div>' +
        '<div class="d">' + esc(city.desc) + '</div>' +
        '<div class="tiny">压力修正 ' + sign(city.attrEffect['压力值']) + ' · 财富上限系数 ×' + city.attrEffect['财富上限'] + '</div>' +
        '</div>';
    }
    html += '</div>';

    /* 天赋 */
    html += '<div class="card"><h3>③ 抽取天赋（3 选 1）<span class="tail">剩余重抽 ' + ui.rerollLeft + '</span></h3>';
    if (!ui.drawnTalents.length) {
      html += '<button class="btn primary" onclick="window.ui.drawTalents()">抽取天赋</button>';
    } else {
      for (var t = 0; t < ui.drawnTalents.length; t++) {
        var tal = ui.drawnTalents[t];
        html += '<div class="talentCard' + (ui.pickedTalent === t ? ' sel' : '') + '" onclick="window.ui.pickTalent(' + t + ')">' +
          '<div class="tn">' + esc(tal.name) + '</div>' +
          '<div class="td">' + esc(tal.desc) + '</div>' +
          '<div class="tm">' + talentModText(tal) + '</div></div>';
      }
      html += '<div class="btnRow">' +
        '<button class="btn ghost" onclick="window.ui.drawTalents()">重新抽取（剩 ' + ui.rerollLeft + '）</button></div>';
    }
    html += '</div>';

    /* 开始 */
    var ready = ui.startEra && ui.startCity && ui.pickedTalent >= 0;
    html += '<div class="card"><button class="btn primary" ' + (ready ? '' : 'disabled ') + 'onclick="window.ui.beginLife()">' +
      (reinc ? '开始这一世' : '开始人生') + '</button>' +
      '<button class="btn ghost" onclick="window.ui.askResetAll()">清空全部存档（含成就）</button>' +
      '<div class="tiny center">数据保存在本机 localStorage，不需要联网。</div></div>';

    if (TL.global.lives > 0) {
      html += '<div class="card"><h3>前尘往事</h3><div class="muted">已轮回 ' + TL.global.lives + ' 世 · 最高寿命 ' +

        '<div class="tiny">前世余荫：' + inheritText() + '</div></div>';
    }
    $('screen').innerHTML = html;
  }

  function talentModText(tal) {
    var m = tal.attrModify || {}, parts = [];
    for (var k in m) {
      if (!Object.prototype.hasOwnProperty.call(m, k)) { continue; }
      if (m[k] === 0) { continue; }
      parts.push(k + (m[k] > 0 ? '+' : '') + (k === '财富' ? TL.fmt(m[k]) : m[k]));
    }
    return parts.length ? parts.join('  ') : '无属性修正';
  }
  function inheritText() {
    var inh = TL.global.inherit || {}, parts = [];
    for (var k in inh) {
      if (!Object.prototype.hasOwnProperty.call(inh, k)) { continue; }
      if (inh[k]) { parts.push(k + '+' + inh[k]); }
    }
    return parts.length ? parts.join('  ') : '无';
  }

  ui.setEra = function (e) {
    ui.startEra = e;
    /* 城市必须适配年代 */
    var cur = TL.cityByName(ui.startCity);
    if (!cur || !cur.eraFactor[e]) {
      for (var i = 0; i < TL.DATA.city.length; i++) {
        if (TL.DATA.city[i].eraFactor[e]) { ui.startCity = TL.DATA.city[i].cityName; break; }
      }
    }
    render();
  };
  ui.setCity = function (name) { ui.startCity = name; render(); };

  ui.drawTalents = function () {
    try {
      if (ui.drawnTalents.length && ui.rerollLeft <= 0) { window.toast('重抽次数已用完'); return; }
      if (ui.drawnTalents.length) { ui.rerollLeft -= 1; }
      var pool = TL.DATA.talents.slice(0);
      var out = [], used = {};
      var guard = 0;
      while (out.length < 3 && guard < 500) {
        guard++;
        var i = TL.rnd(pool.length);
        if (used[i]) { continue; }
        used[i] = 1;
        out.push(pool[i]);
      }
      ui.drawnTalents = out;
      ui.pickedTalent = -1;
      window.toast('抽到 ' + out.length + ' 个天赋，请选择 1 个');

  ui.pickTalent = function (i) {

  /* ---------------- 属性主页 ---------------- */
  function viewHome() {
